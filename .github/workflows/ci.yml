name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ruff + pytest (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pytest
      - name: Lint
        run: ruff check src
      - name: Test
        # 默认环境变量即可——仓库用 .env.example 的占位值；
        # 真正需要 LLM 的测试通过 mock / skip 隔离（见 tests/ 离线用例）
        run: pytest -q --no-header
